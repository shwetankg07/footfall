name: Refresh demo shop

# Rebuilds the public demo shop every night so its 28 days always end today: a dashboard that
# opens on "last 7 days" must never be empty, however long after a deploy someone looks.
on:
  schedule:
    # 02:15 IST, a quiet hour. GitHub often starts scheduled runs late; the 3 days written
    # ahead of now cover that, and a missed night or two.
    - cron: '45 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Same group as the hourly scorer: both write forecasts and alerts, so they take turns.
concurrency:
  group: footfall-ml-score
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.DEMO_SITE_ID != ''
    runs-on: ubuntu-latest
    # The backfill replays every hour against Atlas from GitHub's runners, which takes minutes.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ml
    env:
      SITE: ${{ vars.DEMO_SITE_ID }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ vars.MONGO_DB || secrets.MONGO_DB || 'footfall' }}
      API_URL: ${{ vars.API_URL || secrets.API_URL }}
      INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m footfall_ml.seed_demo --site "$SITE" --days 28 --ahead-days 3 --reset
      # 12 days covers every planted event (the oldest is 11 days back) and the 7-day forecast band.
      - run: python -m footfall_ml.score --site "$SITE" --backfill-days 12
      - run: python -m footfall_ml.insights --site "$SITE"
