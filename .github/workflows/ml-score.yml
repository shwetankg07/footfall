name: Footfall Intelligence

on:
  schedule:
    # :35 is just after an IST hour closes (IST hours start at :30 UTC).
    - cron: '35 * * * *'
    - cron: '5 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footfall-ml-score
  cancel-in-progress: false

jobs:
  score:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '35 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m footfall_ml.score
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ vars.MONGO_DB || secrets.MONGO_DB || 'footfall' }}
          API_URL: ${{ vars.API_URL || secrets.API_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
  insights:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m footfall_ml.insights
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ vars.MONGO_DB || secrets.MONGO_DB || 'footfall' }}
