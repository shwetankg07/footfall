<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Footfall is cookieless web analytics with live visitors, funnels and alerts that learn your site's normal traffic." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      try {
        var t = localStorage.getItem("footfall-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // The landing page is always black; don't flash the light theme while it loads.
        if (location.pathname === "/") document.documentElement.style.background = "#000";
      } catch (e) {}
    </script>
    <title>Footfall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
